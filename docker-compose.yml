services:
  api:
    build:
      context: ./api-dunia-express
      dockerfile: Dockerfile
    container_name: dunia_express_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./api-dunia-express/.env

  frontend:
    build:
      context: ./frontend-dunia-express
      dockerfile: Dockerfile
    container_name: dunia_express_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - api